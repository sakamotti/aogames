<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8ddc2">
<title>なでなで どうぶつ - あそびばこ</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body {
    overflow: hidden;
    background:
      radial-gradient(circle at 16% 18%, rgba(255,255,255,.9) 0 4%, transparent 18%),
      linear-gradient(165deg, #fff8ec 0 56%, #edd0ad 57% 100%);
  }

  .pet-screen {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    justify-items: center;
    padding: calc(var(--safe-top) + 78px) 14px calc(var(--safe-bottom) + var(--safe-bottom-gap));
  }

  .pet-header {
    position: relative;
    z-index: 20;
    display: grid;
    justify-items: center;
    gap: 6px;
  }

  .species-toggle {
    display: flex;
    gap: 12px;
    padding: 7px;
    border-radius: 26px;
    background: rgba(255,255,255,.74);
    box-shadow: 0 8px 22px rgba(105,72,51,.13);
    backdrop-filter: blur(8px);
  }

  .species-btn {
    position: relative;
    width: 70px;
    height: 62px;
    border-radius: 20px;
    background: rgba(255,255,255,.7);
    display: grid;
    place-items: center;
    border: 3px solid transparent;
    transition: transform .16s ease, border-color .16s ease, background .16s ease;
  }

  .species-btn img {
    width: 58px;
    height: 58px;
    object-fit: contain;
    filter: drop-shadow(0 5px 5px rgba(83,55,37,.14));
    pointer-events: none;
  }

  .species-btn.active {
    transform: translateY(-2px);
    border-color: #f19462;
    background: #fff;
  }

  .species-btn.active::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -8px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #f19462;
    transform: translateX(-50%);
  }

  .pet-name {
    margin: 0;
    color: #6f513d;
    font-size: clamp(17px, 4.6vw, 22px);
    letter-spacing: .08em;
  }

  .affection-row {
    display: flex;
    gap: 4px;
    min-height: 27px;
  }

  .affection-row span {
    font-size: 22px;
    opacity: .18;
    filter: grayscale(1);
    transform: scale(.84);
    transition: opacity .22s ease, transform .28s cubic-bezier(.2,1.65,.45,1), filter .22s ease;
  }

  .affection-row span.filled {
    opacity: 1;
    filter: none;
    transform: scale(1.12);
  }

  .pet-area {
    position: relative;
    width: min(100%, 560px);
    min-height: 0;
    display: grid;
    place-items: center;
    isolation: isolate;
  }

  .pet-area::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 6%;
    width: min(78vw, 430px);
    height: min(17vw, 92px);
    border-radius: 50%;
    background: rgba(116,76,45,.12);
    filter: blur(9px);
    transform: translateX(-50%);
  }

  .room-decor {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 32px;
  }

  .room-decor::before,
  .room-decor::after {
    content: '';
    position: absolute;
    bottom: 12%;
    width: 44px;
    height: 62px;
    border-radius: 45% 45% 18px 18px;
    background: linear-gradient(135deg, #9fc58f, #5c986c);
    box-shadow: 0 15px 0 -5px #c5895d;
    opacity: .65;
  }

  .room-decor::before { left: 2%; transform: rotate(-8deg); }
  .room-decor::after { right: 2%; transform: scale(.8) rotate(8deg); }

  .pet-actor {
    position: relative;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 18px;
    touch-action: none;
    transition: transform 760ms cubic-bezier(.35,.05,.2,1);
  }

  .pet-image {
    grid-area: 1 / 1;
    position: relative;
    z-index: 2;
    width: min(78vw, 52vh, 410px);
    height: min(78vw, 52vh, 410px);
    object-fit: contain;
    display: block;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 17px 13px rgba(75,48,31,.22));
    animation: pet-breathe 2.8s ease-in-out infinite;
    transform-origin: 50% 84%;
    transition: opacity 100ms ease;
  }

  .pet-image.is-visible { opacity: 1; }

  .pet-visual {
    display: grid;
    place-items: center;
  }

  .joy-halo {
    position: absolute;
    width: 76%;
    aspect-ratio: 1;
    border-radius: 50%;
    z-index: 1;
    opacity: 0;
    transform: scale(.72);
    background: radial-gradient(circle, rgba(255,241,158,.82), rgba(255,211,126,.16) 55%, transparent 72%);
    transition: opacity .25s ease, transform .35s ease;
  }

  .pet-actor.petting .joy-halo,
  .pet-actor.eating .joy-halo { opacity: 1; transform: scale(1); }

  .pet-actor.petting .pet-image.is-visible { animation: pet-happy .46s ease-in-out infinite alternate; }
  .pet-actor.walking .pet-image.is-visible { animation: pet-walk .32s ease-in-out infinite alternate; }
  .pet-actor.eating .pet-image.is-visible { animation: pet-eat .36s ease-in-out infinite alternate; }
  .pet-actor.bounce .pet-image.is-visible { animation: pet-hello .62s ease-out; }

  @keyframes pet-breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.018); }
  }

  @keyframes pet-happy {
    from { transform: rotate(-1.4deg) translateY(0) scale(1.02); }
    to { transform: rotate(1.4deg) translateY(-7px) scale(1.045); }
  }

  @keyframes pet-walk {
    from { transform: rotate(-3deg) translateY(0); }
    to { transform: rotate(3deg) translateY(-6px); }
  }

  @keyframes pet-eat {
    from { transform: scaleX(var(--face-x, 1)) rotate(-1deg) translateY(0) scaleY(1); }
    to { transform: scaleX(var(--face-x, 1)) rotate(1deg) translateY(5px) scaleY(.97); }
  }

  .pet-actor.face-right { --face-x: -1; }

  @keyframes pet-hello {
    0%, 100% { transform: translateY(0) rotate(0); }
    35% { transform: translateY(-18px) rotate(-3deg); }
    65% { transform: translateY(-8px) rotate(3deg); }
  }

  .hint-bubble {
    position: absolute;
    z-index: 10;
    top: 8%;
    right: 3%;
    min-width: 74px;
    padding: 9px 13px;
    border-radius: 18px 18px 5px 18px;
    background: rgba(255,255,255,.9);
    color: #80604b;
    font-size: clamp(13px, 3.4vw, 17px);
    text-align: center;
    box-shadow: 0 8px 20px rgba(91,58,37,.13);
    transition: opacity .2s ease, transform .2s ease;
  }

  .hint-bubble.pop { animation: hint-pop .45s cubic-bezier(.2,1.65,.45,1); }
  @keyframes hint-pop { 50% { transform: scale(1.13) rotate(2deg); } }

  .food-spot {
    position: absolute;
    z-index: 9;
    bottom: 6%;
    left: 50%;
    display: grid;
    place-items: center;
    transform: translate(-50%, 0) scale(0);
    transition: transform 280ms cubic-bezier(.2,1.5,.45,1), opacity .2s ease;
    pointer-events: none;
  }

  .food-spot.shown { transform: translate(-50%, 0) scale(1); }
  .food-spot.eaten { opacity: 0; transform: translate(-50%, 0) scale(.15); }
  .food-spot__plate {
    width: 82px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(#fff 0 32%, #d7b9a6 34% 100%);
    border: 4px solid rgba(255,255,255,.82);
    box-shadow: 0 12px 16px rgba(87,57,37,.18);
    display: grid;
    place-items: center;
    font-size: 37px;
  }

  .pet-actions {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(100%, 180px);
    padding-top: 6px;
  }

  .care-btn {
    width: 138px;
    height: 68px;
    padding: 5px 18px 8px;
    border-radius: 24px;
    color: #76523b;
    background: linear-gradient(180deg, #fff 0 54%, #efd4bf 55% 100%);
    border: 4px solid rgba(255,255,255,.86);
    box-shadow: 0 10px 0 #cba27f, 0 16px 22px rgba(84,54,35,.17);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0;
    font-size: 15px;
  }

  .care-btn__icon { font-size: 29px; line-height: 1; }
  .care-btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #cba27f; }
  .care-btn[disabled] { opacity: .55; }

  .heart-particle,
  .spark-particle {
    position: fixed;
    pointer-events: none;
    z-index: 1500;
    transform: translate(-50%, -50%);
  }

  .heart-particle { font-size: 24px; animation: heart-float 820ms ease-out forwards; }
  .spark-particle { width: 10px; height: 10px; border-radius: 50%; background: #fff4a8; box-shadow: 0 0 11px #ffd56e; animation: spark-float 520ms ease-out forwards; }

  @keyframes heart-float {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.55); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift)), -110px) scale(1.18) rotate(var(--turn)); }
  }

  @keyframes spark-float {
    0% { opacity: .95; transform: translate(-50%, -50%) scale(.5); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(1.5); }
  }

  .rub-glow {
    position: fixed;
    z-index: 4;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.7);
    background: radial-gradient(circle, rgba(255,255,255,.76), rgba(255,231,147,.28) 45%, transparent 72%);
    transition: opacity .15s ease, transform .15s ease;
  }

  .rub-glow.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  @media (orientation: landscape) and (max-height: 540px) {
    .pet-screen {
      grid-template-columns: 160px minmax(0, 1fr) 145px;
      grid-template-rows: 1fr;
      align-items: center;
      padding: calc(var(--safe-top) + 68px) calc(var(--safe-right) + 10px) calc(var(--safe-bottom) + 24px) calc(var(--safe-left) + 10px);
    }
    .species-toggle { flex-direction: column; gap: 7px; }
    .pet-image { width: min(50vw, 68vh, 350px); height: min(50vw, 68vh, 350px); }
    .hint-bubble { top: 1%; right: 8%; }
    .pet-actions { padding: 0; }
    .pet-actions { width: 145px; }
    .care-btn { width: 126px; height: 62px; }
  }

  @media (max-height: 660px) and (orientation: portrait) {
    .pet-screen { padding-top: calc(var(--safe-top) + 72px); }
    .species-btn { width: 60px; height: 53px; }
    .species-btn img { width: 50px; height: 50px; }
    .pet-image { width: min(72vw, 45vh, 330px); height: min(72vw, 45vh, 330px); }
    .care-btn { width: 126px; height: 60px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pet-image { animation: none; }
    .pet-actor.petting .pet-image,
    .pet-actor.walking .pet-image,
    .pet-actor.eating .pet-image,
    .pet-actor.bounce .pet-image { animation-duration: 1ms; animation-iteration-count: 1; }
    .pet-actor.face-right .pet-image { transform: scaleX(-1); }
  }
</style>
</head>
<body>
  <main class="pet-screen">
    <header class="pet-header">
      <div class="species-toggle" aria-label="どうぶつをえらぶ">
        <button class="species-btn active" id="btnCat" aria-label="みけをえらぶ" aria-pressed="true">
          <img src="../../icons/animals/cat.png" alt="">
        </button>
        <button class="species-btn" id="btnDog" aria-label="ポチをえらぶ" aria-pressed="false">
          <img src="../../icons/animals/dog.png" alt="">
        </button>
      </div>
      <p class="pet-name" id="petName">みけ</p>
      <div class="affection-row" id="affectionRow" aria-label="なかよしメーター"></div>
    </header>

    <section class="pet-area" aria-label="みけをなでる場所">
      <div class="room-decor" aria-hidden="true"></div>
      <div class="hint-bubble" id="hintBubble" aria-live="polite">なでなで してね</div>
      <div class="pet-actor" id="petActor" role="button" tabindex="0" aria-label="みけをなでる">
        <div class="joy-halo" aria-hidden="true"></div>
        <div class="pet-visual">
          <img class="pet-image is-visible" id="petImageNormal" src="../../icons/animals/cat.png" alt="みけ">
          <img class="pet-image" id="petImageHappy" src="../../icons/animals/cat-happy.png" alt="">
          <img class="pet-image" id="petImageEating" src="../../icons/animals/cat-eating.png" alt="">
        </div>
      </div>
      <div class="food-spot" id="foodSpot" aria-hidden="true">
        <div class="food-spot__plate" id="foodIcon">🐟</div>
      </div>
    </section>

    <div class="pet-actions">
      <button class="care-btn" data-care="food" aria-label="みけにごはんをあげる">
        <span class="care-btn__icon" id="treatIcon">🐟</span>
        <span>ごはん</span>
      </button>
    </div>
  </main>
  <div class="rub-glow" id="rubGlow" aria-hidden="true"></div>

  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
