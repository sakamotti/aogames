<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef0f7">
<title>エレベーター - あそびばこ</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: linear-gradient(160deg, #eef0f7, #fbeaf2); overflow: hidden; }

  .elevator-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + var(--safe-bottom-gap));
    gap: 12px;
  }

  .cab {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, #dfe3ee, #c9cfe0);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 14px;
    flex-shrink: 0;
  }

  .display {
    background: #1c2033;
    border-radius: var(--radius-md);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .display__arrow {
    font-size: 22px;
    color: #4a5578;
    transition: color 0.15s;
  }
  .display__arrow.on { color: #ffd23f; text-shadow: 0 0 10px #ffd23f; }
  .display__num {
    font-family: "Courier New", monospace;
    font-size: clamp(34px, 9vw, 48px);
    font-weight: 800;
    color: #ff9f4a;
    text-shadow: 0 0 12px rgba(255, 159, 74, 0.75);
    min-width: 2.4ch;
    text-align: center;
  }

  .doors {
    position: relative;
    height: min(30vh, 190px);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: linear-gradient(160deg, #fff3d6, #ffe0ec);
  }
  .doors__mascot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
  }
  .doors__mascot img {
    width: 58%;
    max-width: 150px;
    filter: drop-shadow(0 8px 10px rgba(74, 59, 120, 0.25));
    transform: translateY(20px);
    opacity: 0;
    transition: transform 0.35s ease-out, opacity 0.35s ease-out;
  }
  .doors.open .doors__mascot img {
    transform: translateY(0);
    opacity: 1;
  }
  .doors__leaf {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 51%;
    background: linear-gradient(180deg, #e5e9f4, #c3c9dc);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
    transition: transform 650ms cubic-bezier(0.65, 0, 0.35, 1);
    z-index: 2;
  }
  .doors__leaf--l { left: 0; border-right: 3px solid #a9b0c8; }
  .doors__leaf--r { right: 0; border-left: 3px solid #a9b0c8; }
  .doors.open .doors__leaf--l { transform: translateX(-100%); }
  .doors.open .doors__leaf--r { transform: translateX(100%); }

  .door-controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 12px;
  }
  .door-btn {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: var(--white);
    box-shadow: var(--shadow-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    color: var(--ink);
  }
  .door-btn span { font-size: 13px; margin-top: 1px; }
  .door-btn:active { transform: scale(0.92); }

  .floor-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3vw;
    width: 100%;
    max-width: 420px;
    flex: 1;
    align-content: center;
  }
  .floor-btn {
    aspect-ratio: 1 / 0.85;
    border-radius: var(--radius-md);
    background: var(--white);
    box-shadow: var(--shadow-soft);
    border: 4px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 5.2vw, 26px);
    font-weight: 800;
    color: var(--ink);
  }
  .floor-btn:active { transform: scale(0.92); }
  .floor-btn.lit {
    background: linear-gradient(160deg, #ffe27a, #ffb84d);
    color: #7a4a00;
    box-shadow: 0 0 0 5px rgba(255, 184, 77, 0.45), var(--shadow-soft);
  }
</style>
</head>
<body>
  <div class="elevator-wrap">
    <div class="cab">
      <div class="display">
        <span class="display__arrow" id="arrowUp">▲</span>
        <span class="display__num" id="floorNum">1</span>
        <span class="display__arrow" id="arrowDown">▼</span>
      </div>
      <div class="doors" id="doors">
        <div class="doors__mascot"><img id="doorsMascot" src="" alt=""></div>
        <div class="doors__leaf doors__leaf--l"></div>
        <div class="doors__leaf doors__leaf--r"></div>
      </div>
      <div class="door-controls">
        <button class="door-btn" id="btnOpen">開<span>ひらく</span></button>
        <button class="door-btn" id="btnClose">閉<span>とじる</span></button>
      </div>
    </div>

    <div class="floor-grid" id="floorGrid"></div>
  </div>
  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
