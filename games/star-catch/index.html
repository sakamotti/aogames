<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a5e">
<title>ほしとり - あそびばこ</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: linear-gradient(180deg, #14183a 0%, #232a6b 60%, #3a3f9c 100%); }
  .play-canvas { background: transparent; }
  .jar {
    position: absolute;
    bottom: calc(var(--safe-bottom) + var(--safe-bottom-gap));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 20px;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas class="play-canvas" id="c"></canvas>
  </div>
  <div class="jar" id="jar">🫙</div>
  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
