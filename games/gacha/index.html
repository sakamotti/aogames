<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe9f2">
<title>ガチャガチャ - あそびばこ</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: linear-gradient(160deg, #ffe9f2, #eef0ff); overflow: hidden; }

  .gacha-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + var(--safe-bottom-gap));
    gap: 2px;
  }

  .collection-row {
    flex-shrink: 0;
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 420px;
    background: rgba(255,255,255,0.7);
    border-radius: 999px;
    padding: 5px 9px;
    box-shadow: var(--shadow-soft);
    margin-bottom: 4px;
  }
  .collection-row__slot {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    filter: grayscale(1);
    opacity: 0.35;
    transition: filter 0.3s, opacity 0.3s, transform 0.3s;
  }
  .collection-row__slot img { width: 78%; height: 78%; object-fit: contain; }
  .collection-row__slot.got {
    filter: none;
    opacity: 1;
    transform: scale(1.08);
  }

  .machine {
    position: relative;
    width: min(78vw, 320px);
    aspect-ratio: 1 / 1.2;
    flex-shrink: 0;
  }
  .machine__dome {
    position: absolute;
    top: 0;
    left: 8%;
    width: 84%;
    height: 52%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #cfe4ff 70%);
    box-shadow: inset 0 -10px 18px rgba(74,59,120,0.15), var(--shadow-soft);
    overflow: hidden;
    border: 6px solid #fff;
  }
  .capsule-dot {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    animation: dot-bob 2.6s ease-in-out infinite;
  }
  .capsule-dot::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    border-radius: 22px 22px 0 0;
    background: rgba(255,255,255,0.75);
  }
  @keyframes dot-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .machine__body {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 54%;
    border-radius: 22px;
    background: linear-gradient(160deg, #ff8fb3, #ff5f8f);
    box-shadow: var(--shadow-soft);
  }
  .machine__slot {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 15px;
    border-radius: 8px;
    background: #6b1035;
    box-shadow: 0 0 0 5px rgba(255, 210, 63, 0.35);
    animation: slot-glow 1.4s ease-in-out infinite;
  }
  @keyframes slot-glow {
    0%, 100% { box-shadow: 0 0 0 5px rgba(255, 210, 63, 0.35); }
    50% { box-shadow: 0 0 0 10px rgba(255, 210, 63, 0); }
  }
  .machine__slot-label {
    position: absolute;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(107, 16, 53, 0.5);
  }
  .machine__face {
    position: absolute;
    top: 44%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 22px;
  }
  .machine__face span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
  }
  .machine__flap {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 46%;
    height: 12%;
    border-radius: 8px;
    background: rgba(107, 16, 53, 0.55);
  }

  .crank {
    position: absolute;
    right: -9%;
    top: 58%;
    width: 28%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: var(--white);
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .crank__handle {
    width: 70%;
    height: 12%;
    background: var(--ink);
    border-radius: 8px;
    position: relative;
    transition: transform 220ms ease-out;
  }
  .crank__handle::after {
    content: '';
    position: absolute;
    right: -6px;
    top: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: var(--shadow-soft);
  }
  .machine.shake { animation: machine-shake 220ms ease-in-out; }
  @keyframes machine-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-1deg); }
    75% { transform: translateX(4px) rotate(1deg); }
  }
  .crank.ready .crank__handle::after { animation: crank-glow 1s ease-in-out infinite; }
  @keyframes crank-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,210,63,0.6); }
    50% { box-shadow: 0 0 0 8px rgba(255,210,63,0); }
  }

  .coin-zone {
    position: relative;
    width: 100%;
    max-width: 380px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .coin-tray {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    box-shadow: inset 0 4px 10px rgba(74,59,120,0.18);
  }
  .coin-hint {
    position: absolute;
    top: -2px;
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .coin-drag {
    position: fixed;
    left: 0;
    top: 0;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    z-index: 50;
    touch-action: none;
    filter: drop-shadow(0 4px 6px rgba(74,59,120,0.35));
    transition: left 320ms cubic-bezier(0.34,1.56,0.64,1), top 320ms cubic-bezier(0.34,1.56,0.64,1), transform 250ms ease-out;
  }
  .coin-drag.dragging { transition: none; }
  .coin-drag.hidden { transform: translate(-50%, -50%) scale(0); }

  .tray {
    position: relative;
    width: 170px;
    height: 100px;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .tray__shelf {
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    width: 110px;
    height: 16px;
    border-radius: 10px;
    background: rgba(107, 16, 53, 0.12);
  }
  .capsule {
    position: absolute;
    left: 50%;
    top: -50px;
    width: 84px;
    height: 84px;
    transform: translate(-50%, 0) scale(0);
    transition: top 550ms cubic-bezier(0.5, 0, 0.75, 0.9), transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .capsule.drop { top: 16px; transform: translate(-50%, 0) scale(1); }
  .capsule.waiting {
    cursor: pointer;
    animation: capsule-wait-bounce 1s ease-in-out infinite;
  }
  @keyframes capsule-wait-bounce {
    0%, 100% { transform: translate(-50%, 0) scale(1) rotate(0deg); }
    50% { transform: translate(-50%, 0) scale(1.08) rotate(-4deg); }
  }
  .capsule__seam {
    position: absolute;
    left: -2px;
    right: -2px;
    top: calc(50% - 2px);
    height: 4px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.15);
    z-index: 2;
  }
  .capsule.open .capsule__seam { opacity: 0; }
  .capsule-tap-hint {
    position: absolute;
    left: 50%;
    top: -34px;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-soft);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 250ms ease-out;
  }
  .capsule.waiting .capsule-tap-hint { opacity: 1; }
  .capsule__half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    transition: transform 350ms ease-out, opacity 350ms ease-out;
  }
  .capsule__half--top { top: 0; border-radius: 42px 42px 0 0; background: var(--coral); }
  .capsule__half--bottom { bottom: 0; border-radius: 0 0 42px 42px; background: #fff; }
  .capsule.open .capsule__half--top { transform: translateY(-34px) rotate(-25deg); opacity: 0; }
  .capsule.open .capsule__half--bottom { transform: translateY(34px) rotate(15deg); opacity: 0; }
  .capsule__prize {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 300ms ease-out 150ms, transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1) 150ms;
  }
  .capsule.open .capsule__prize { opacity: 1; transform: scale(1); }
  .capsule__prize-img { width: 56%; height: 56%; object-fit: contain; }

  .prize-label {
    font-size: clamp(15px, 4vw, 18px);
    color: var(--ink-soft);
    min-height: 1.4em;
  }
  /* The big reward moment - not a popup/card, the character itself leaps
     out of the capsule (starts at the capsule's exact screen position and
     size, then grows and arcs up to center stage) and is allowed to cover
     the machine so it's unmistakably the focus. */
  .prize-hero {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 900;
    pointer-events: none;
    transform: translate(-50%, -50%);
    line-height: 1;
    filter: drop-shadow(0 14px 20px rgba(74, 59, 120, 0.4));
    opacity: 0;
  }
  .prize-hero__img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .prize-hero.show {
    opacity: 1;
    transition: left 650ms cubic-bezier(0.22, 1.5, 0.36, 1),
      top 650ms cubic-bezier(0.22, 1.5, 0.36, 1),
      width 650ms cubic-bezier(0.22, 1.5, 0.36, 1),
      height 650ms cubic-bezier(0.22, 1.5, 0.36, 1),
      opacity 200ms ease-out;
  }
  .prize-hero.fade-out {
    transition: opacity 400ms ease-in;
    opacity: 0;
  }
  .prize-hero.settled {
    animation: prize-hero-settle 550ms ease-out;
  }
  @keyframes prize-hero-settle {
    0% { transform: translate(-50%, -50%) scale(1); }
    35% { transform: translate(-50%, -50%) scale(1.15) rotate(-4deg); }
    65% { transform: translate(-50%, -50%) scale(0.95) rotate(3deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }

  .prize-name {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 900;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -6px);
    transition: opacity 300ms ease-out, transform 300ms ease-out;
  }
  .prize-name.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .prize-name__text {
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 800;
    color: var(--ink);
    text-shadow: 0 2px 0 rgba(255,255,255,0.9), 0 4px 10px rgba(74,59,120,0.25);
  }
  .prize-name__fact {
    max-width: min(82vw, 360px);
    margin-top: 4px;
    font-size: clamp(13px, 3.5vw, 17px);
    color: var(--ink-soft);
    text-shadow: 0 2px 0 rgba(255,255,255,0.9);
  }
  .prize-name__new {
    font-size: 16px;
    font-weight: 800;
    color: var(--pink);
    opacity: 0;
  }
  .prize-name.new .prize-name__new {
    animation: choice-badge-pop 500ms ease-out 550ms both;
  }
</style>
</head>
<body>
  <div class="gacha-wrap">
    <div class="collection-row" id="collectionRow"></div>

    <div class="machine" id="machine">
      <div class="machine__dome" id="dome"></div>
      <div class="machine__body">
        <div class="machine__slot"></div>
        <div class="machine__slot-label">COIN</div>
        <div class="machine__face"><span></span><span></span></div>
        <div class="machine__flap"></div>
      </div>
      <div class="crank" id="crank">
        <div class="crank__handle" id="crankHandle"></div>
      </div>
    </div>

    <div class="coin-zone">
      <span class="coin-hint">↑ すべらせてね</span>
      <div class="coin-tray" id="coinTray"></div>
    </div>
    <div class="coin-drag" id="coinDrag" aria-label="コインをすべらせていれる">🪙</div>

    <div class="tray">
      <div class="tray__shelf"></div>
      <div class="capsule" id="capsule">
        <div class="capsule-tap-hint">タップしてね</div>
        <div class="capsule__half capsule__half--top"></div>
        <div class="capsule__half capsule__half--bottom"></div>
        <div class="capsule__seam"></div>
        <div class="capsule__prize" id="prizeEmoji"></div>
      </div>
    </div>
    <p class="prize-label" id="prizeLabel"></p>
  </div>

  <div class="prize-hero" id="prizeHero"></div>
  <div class="prize-name" id="prizeName">
    <div class="prize-name__text" id="prizeNameText"></div>
    <div class="prize-name__fact" id="prizeFact"></div>
    <div class="prize-name__new">はじめて！</div>
  </div>

  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
