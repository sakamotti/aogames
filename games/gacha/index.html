<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffe9f2">
<title>ガチャガチャ - あそびばこ</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: linear-gradient(160deg, #ffe9f2, #eef0ff); overflow: hidden; }

  .gacha-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + var(--safe-bottom-gap));
    gap: 6px;
  }
  .collection-row { position: absolute; top: calc(var(--safe-top) + 20px); }

  .collection-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 420px;
    background: rgba(255,255,255,0.7);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: var(--shadow-soft);
  }
  .collection-row__slot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    filter: grayscale(1);
    opacity: 0.35;
    transition: filter 0.3s, opacity 0.3s, transform 0.3s;
  }
  .collection-row__slot.got {
    filter: none;
    opacity: 1;
    transform: scale(1.08);
  }

  .machine {
    position: relative;
    width: min(64vw, 260px);
    aspect-ratio: 1 / 1.25;
    flex-shrink: 0;
  }
  .machine__dome {
    position: absolute;
    top: 0;
    left: 8%;
    width: 84%;
    height: 52%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #cfe4ff 70%);
    box-shadow: inset 0 -10px 18px rgba(74,59,120,0.15), var(--shadow-soft);
    overflow: hidden;
    border: 6px solid #fff;
  }
  .capsule-dot {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    animation: dot-bob 2.6s ease-in-out infinite;
  }
  .capsule-dot::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    border-radius: 22px 22px 0 0;
    background: rgba(255,255,255,0.75);
  }
  @keyframes dot-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .machine__body {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 54%;
    border-radius: 22px;
    background: linear-gradient(160deg, #ff8fb3, #ff5f8f);
    box-shadow: var(--shadow-soft);
  }
  .machine__slot {
    position: absolute;
    top: 16%;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 8px;
    border-radius: 4px;
    background: #6b1035;
  }
  .machine__slot-label {
    position: absolute;
    top: 24%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 2px;
  }
  .machine__face {
    position: absolute;
    top: 44%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 22px;
  }
  .machine__face span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
  }
  .machine__flap {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 46%;
    height: 12%;
    border-radius: 8px;
    background: rgba(107, 16, 53, 0.55);
  }

  .crank {
    position: absolute;
    right: -14%;
    top: 58%;
    width: 30%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: var(--white);
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .crank__handle {
    width: 70%;
    height: 12%;
    background: var(--ink);
    border-radius: 8px;
    position: relative;
    transition: transform 220ms ease-out;
  }
  .crank__handle::after {
    content: '';
    position: absolute;
    right: -6px;
    top: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: var(--shadow-soft);
  }
  .machine.shake { animation: machine-shake 220ms ease-in-out; }
  @keyframes machine-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px) rotate(-1deg); }
    75% { transform: translateX(4px) rotate(1deg); }
  }
  .crank.ready .crank__handle::after { animation: crank-glow 1s ease-in-out infinite; }
  @keyframes crank-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,210,63,0.6); }
    50% { box-shadow: 0 0 0 8px rgba(255,210,63,0); }
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 6px;
  }
  .coin-button {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: var(--shadow-soft);
    font-size: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coin-button:active { transform: scale(0.92); }
  .coin-button[disabled] { opacity: 0.45; }
  .coin-flying {
    position: fixed;
    font-size: 26px;
    pointer-events: none;
    z-index: 500;
    transition: left 420ms ease-in, top 420ms ease-in, transform 420ms ease-in, opacity 420ms ease-in;
  }

  .tray {
    position: relative;
    width: 140px;
    height: 78px;
    flex-shrink: 0;
    margin-top: -6px;
  }
  .tray__shelf {
    position: absolute;
    left: 50%;
    bottom: 6px;
    transform: translateX(-50%);
    width: 100px;
    height: 14px;
    border-radius: 10px;
    background: rgba(107, 16, 53, 0.12);
  }
  .capsule {
    position: absolute;
    left: 50%;
    top: -40px;
    width: 64px;
    height: 64px;
    transform: translate(-50%, 0) scale(0);
    transition: top 550ms cubic-bezier(0.5, 0, 0.75, 0.9), transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .capsule.drop { top: 14px; transform: translate(-50%, 0) scale(1); }
  .capsule__half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    transition: transform 350ms ease-out, opacity 350ms ease-out;
  }
  .capsule__half--top { top: 0; border-radius: 32px 32px 0 0; background: var(--coral); }
  .capsule__half--bottom { bottom: 0; border-radius: 0 0 32px 32px; background: #fff; }
  .capsule.open .capsule__half--top { transform: translateY(-30px) rotate(-25deg); opacity: 0; }
  .capsule.open .capsule__half--bottom { transform: translateY(30px) rotate(15deg); opacity: 0; }
  .capsule__prize {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 300ms ease-out 150ms, transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1) 150ms;
  }
  .capsule.open .capsule__prize { opacity: 1; transform: scale(1); }

  .prize-label {
    font-size: clamp(15px, 4vw, 18px);
    color: var(--ink-soft);
    min-height: 1.4em;
  }
  .new-badge {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: 16px;
    color: var(--pink);
    animation: celebrate-pop 900ms ease-out forwards;
  }
</style>
</head>
<body>
  <div class="gacha-wrap">
    <div class="collection-row" id="collectionRow"></div>

    <div class="machine" id="machine">
      <div class="machine__dome" id="dome"></div>
      <div class="machine__body">
        <div class="machine__slot"></div>
        <div class="machine__slot-label">COIN</div>
        <div class="machine__face"><span></span><span></span></div>
        <div class="machine__flap"></div>
      </div>
      <div class="crank" id="crank">
        <div class="crank__handle" id="crankHandle"></div>
      </div>
    </div>

    <div class="controls">
      <button class="coin-button" id="coinBtn" aria-label="コインをいれる">🪙</button>
    </div>

    <div class="tray">
      <div class="tray__shelf"></div>
      <div class="capsule" id="capsule">
        <div class="capsule__half capsule__half--top"></div>
        <div class="capsule__half capsule__half--bottom"></div>
        <div class="capsule__prize" id="prizeEmoji"></div>
      </div>
    </div>
    <p class="prize-label" id="prizeLabel"></p>
  </div>
  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
