<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>おえかき</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-message">画面を横にしてください</div>
    <a href="../../index.html" class="back-button">🏠 メニュー</a>
    <div class="toolbar">
        <div class="color-btn active" style="background:black" onclick="setColor('black', this)"></div>
        <div class="color-btn" style="background:#ff3b30" onclick="setColor('#ff3b30', this)"></div>
        <div class="color-btn" style="background:#007aff" onclick="setColor('#007aff', this)"></div>
        <div class="color-btn" style="background:#4cd964" onclick="setColor('#4cd964', this)"></div>
        <div class="color-btn" style="background:#ffcc00" onclick="setColor('#ffcc00', this)"></div>
        <div class="color-btn" style="background:white; border: 1px solid #ccc" onclick="setColor('white', this)">🗑️</div>
        <button class="clear-btn" onclick="clearCanvas()">ぜんぶけす</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
