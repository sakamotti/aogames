<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ed" />
    <title>ロボットにおしえて | あそびばこ</title>
    <link rel="icon" href="../../icons/favicon-32.png" />
    <link rel="stylesheet" href="../../shared/style.css" />
    <link rel="stylesheet" href="../../shared/challenge.css" />
  </head>
  <body class="playroom">
    <main class="room">
      <header class="challenge-head">
        <p class="room-brand">あそびばこ / かんがえる あそび</p>
        <h1 id="gameTitle">ロボットにおしえて</h1>
        <p class="muted">じぶんの ペースで、なんどでも。</p>
      </header>
      <nav class="toolbar" aria-label="むずかしさ">
        <button class="pill" data-level="1" aria-pressed="true">
          🌱 はじめて</button
        ><button class="pill" data-level="2" aria-pressed="false">
          🌿 なれてきた</button
        ><button class="pill" data-level="3" aria-pressed="false">
          🌳 チャレンジ
        </button>
      </nav>
      <p id="progress" class="progress-text"></p>
      <section class="challenge-panel">
        <div class="instruction">
          <img src="../../icons/characters/kuma.png" alt="くまた" />
          <p id="prompt" aria-live="polite"></p>
          <button class="secondary" id="listen" aria-label="せつめいを きく">
            🔈
          </button>
        </div>
        <div id="board"></div>
        <div id="result" class="feedback" hidden>
          <p id="resultText"></p>
          <button id="next" class="primary">つぎも あそぶ →</button
          ><a href="../../index.html" class="secondary">ほかの あそびへ</a>
        </div>
      </section>
      <div class="actions">
        <button id="reset" class="secondary">↻ あたらしい もんだい</button>
      </div>
      <p class="muted">
        保護者の方へ：難易度はいつでも選び直せます。メダルはこの端末に保存されます。
      </p>
    </main>
    <script src="../../shared/app.js"></script>
    <script src="../../shared/catalog.js"></script>
    <script src="../../shared/challenge-models.js"></script>
    <script src="../../shared/challenge.js"></script>
    <script src="script.js"></script>
  </body>
</html>
