<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff1da">
<title>どうぶつタッチ - あそびばこ</title>
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { background: linear-gradient(160deg, #fff1da, #ffe3ef); overflow: hidden; }
  .stage { display: flex; align-items: center; justify-content: center; }
  .grid {
    width: 100%;
    height: 100%;
    max-width: 900px;
    max-height: 900px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3vmin;
    padding: 3vmin;
    padding-top: calc(3vmin + 60px);
  }
  .animal-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease-out;
    border: 5px solid var(--card-color, var(--pink));
  }
  .animal-card__img {
    width: min(18vw, 18vh);
    height: min(18vw, 18vh);
    object-fit: contain;
  }
  .animal-card.bounce { animation: animal-bounce 500ms ease-out; }
  @keyframes animal-bounce {
    0% { transform: scale(1); }
    35% { transform: scale(1.22) rotate(-4deg); }
    65% { transform: scale(0.94) rotate(3deg); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grid" id="grid"></div>
  </div>
  <script src="../../shared/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
