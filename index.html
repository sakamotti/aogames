<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffb84d">
<meta name="description" content="4〜6歳向け・外出先でも遊べるオフライン対応の知育ミニゲーム集「あそびばこ」。くまた・みけ・ぴょんのなかまたちと一緒にあそぼう。">
<title>あそびばこ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="shared/style.css">
<style>
  /* The base stylesheet sets touch-action:none on body for the games (which
     drive every interaction themselves and never scroll) - but the launcher
     is a plain scrolling list once there are more tiles than fit on one
     screen, so it needs touch scrolling back, or a phone with a small/old
     screen simply can't reach the games below the fold at all. min-height
     falls back to 100vh first for browsers that don't understand dvh. */
  body {
    overflow-y: auto;
    position: static;
    min-height: 100vh;
    min-height: 100dvh;
    touch-action: pan-y;
    -webkit-overflow-scrolling: touch;
  }
  .home-wrap {
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 18px calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .home-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(26px, 6vw, 40px);
    margin: 0 0 4px;
  }
  .home-title img { width: 1.15em; height: 1.15em; border-radius: 26%; box-shadow: var(--shadow-soft); }
  .home-sub {
    margin: 0 0 22px;
    font-size: clamp(13px, 3vw, 16px);
    font-weight: 600;
    color: var(--ink-soft);
  }
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 900px;
  }
  .game-tile {
    --tile-color: var(--pink);
    background: var(--white);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 18px 10px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 0.92;
    transition: transform 0.1s ease-out;
    border: 4px solid var(--tile-color);
  }
  .game-tile:active { transform: scale(0.94); }
  .game-tile__emoji {
    font-size: clamp(40px, 9vw, 60px);
    line-height: 1;
    margin-bottom: 10px;
  }
  .game-tile__char {
    width: clamp(48px, 10vw, 66px);
    height: clamp(48px, 10vw, 66px);
    margin-bottom: 10px;
  }
  .game-tile__pet-pair {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: clamp(50px, 11vw, 70px);
    margin-bottom: 8px;
  }
  .game-tile__pet-pair img {
    width: clamp(48px, 10vw, 66px);
    height: clamp(48px, 10vw, 66px);
    object-fit: contain;
    filter: drop-shadow(0 5px 4px rgba(74, 59, 120, 0.16));
  }
  .game-tile__pet-pair img + img { margin-left: clamp(-14px, -2vw, -8px); }
  .friends-row {
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
  }
  .friends-row img {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: var(--shadow-soft);
    padding: 2px;
  }
  .game-tile__label {
    font-size: clamp(15px, 3.2vw, 19px);
    color: var(--ink);
    text-align: center;
  }
  .home-footer {
    margin-top: 26px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    max-width: 480px;
    line-height: 1.6;
  }
  .version-tag {
    margin-top: 10px;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.6;
    text-align: center;
  }

  /* Smaller/older phones and landscape orientation (short viewport height)
     both need the tiles to shrink so more fit per screen - scrolling works
     now, but the fewer screenfuls it takes to see every game, the better. */
  @media (max-width: 380px), (max-height: 480px) {
    .home-wrap { padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
    .home-title { font-size: clamp(20px, 5.5vw, 28px); margin-bottom: 2px; }
    .home-sub { margin-bottom: 10px; }
    .friends-row { gap: 10px; margin-bottom: 10px; }
    .friends-row img { width: 36px; height: 36px; }
    .game-grid { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 10px; }
    .game-tile { padding: 12px 8px 10px; }
    .game-tile__emoji { font-size: clamp(28px, 8vw, 42px); margin-bottom: 6px; }
    .game-tile__char { width: clamp(34px, 8vw, 48px); height: clamp(34px, 8vw, 48px); margin-bottom: 6px; }
    .game-tile__label { font-size: clamp(11px, 2.8vw, 14px); }
    .home-footer { margin-top: 16px; }
  }

  /* Landscape phones specifically: widen the grid's max-width so the extra
     horizontal room is used for more columns instead of wasted side margin. */
  @media (orientation: landscape) {
    .game-grid { max-width: 1100px; }
  }
</style>
</head>
<body>
  <div class="home-wrap">
    <h1 class="home-title"><img src="icons/icon-192.png" alt=""> あそびばこ</h1>
    <p class="home-sub">くまた・みけ・ぴょんと いっしょに あそぼう！</p>
    <div class="friends-row">
      <img src="icons/characters/kuma.png" alt="くまた">
      <img src="icons/characters/neko.png" alt="みけ">
      <img src="icons/characters/usagi.png" alt="ぴょん">
    </div>

    <div class="game-grid">
      <a class="game-tile" style="--tile-color:var(--pink)" href="games/bubble-pop/index.html">
        <div class="game-tile__emoji">🫧</div>
        <div class="game-tile__label">しゃぼんだま</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--purple)" href="games/finger-paint/index.html">
        <div class="game-tile__emoji">🎨</div>
        <div class="game-tile__label">おえかき</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--orange)" href="games/animal-sounds/index.html">
        <div class="game-tile__emoji">🐶</div>
        <div class="game-tile__label">なきごえ</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--blue)" href="games/fireworks/index.html">
        <div class="game-tile__emoji">🎆</div>
        <div class="game-tile__label">はなび</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--yellow)" href="games/star-catch/index.html">
        <div class="game-tile__emoji">⭐</div>
        <div class="game-tile__label">ほしとり</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--teal)" href="games/shape-sorter/index.html">
        <div class="game-tile__emoji">🧩</div>
        <div class="game-tile__label">かたちあわせ</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--green)" href="games/color-hunt/index.html">
        <div class="game-tile__emoji">🌈</div>
        <div class="game-tile__label">いろさがし</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--coral)" href="games/rain-ripples/index.html">
        <div class="game-tile__emoji">💧</div>
        <div class="game-tile__label">あめふり</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--pink)" href="games/animal-quiz/index.html">
        <img class="game-tile__char" src="icons/characters/kuma.png" alt="くまた">
        <div class="game-tile__label">どうぶつクイズ</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--purple)" href="games/memory-match/index.html">
        <img class="game-tile__char" src="icons/characters/neko.png" alt="みけ">
        <div class="game-tile__label">えあわせ</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--orange)" href="games/counting/index.html">
        <img class="game-tile__char" src="icons/characters/usagi.png" alt="ぴょん">
        <div class="game-tile__label">かずあそび</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--coral)" href="games/pet-friends/index.html">
        <div class="game-tile__pet-pair" aria-hidden="true">
          <img src="icons/animals/cat.png" alt="">
          <img src="icons/animals/dog.png" alt="">
        </div>
        <div class="game-tile__label">なでなで</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--blue)" href="games/elevator/index.html">
        <div class="game-tile__emoji">🛗</div>
        <div class="game-tile__label">エレベーター</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--pink)" href="games/gacha/index.html">
        <div class="game-tile__emoji">🎁</div>
        <div class="game-tile__label">ガチャガチャ</div>
      </a>
      <a class="game-tile" style="--tile-color:var(--teal)" href="games/night-safari/index.html">
        <div class="game-tile__emoji">🔦</div>
        <div class="game-tile__label">よるのさがしもの</div>
      </a>
    </div>

    <p class="home-footer">保護者の方へ：広告・課金・通信は一切ありません。オフラインでも遊べます。<br>音を消すには右上の 🔊 ボタンをタップしてください。</p>
    <p class="version-tag" id="versionTag"></p>
  </div>

  <script src="shared/app.js"></script>
  <script>
    KidsApp.initCommon({ home: false });

    // Shows the version the service worker is *actually* running, so it's
    // obvious at a glance whether a fresh install/update really landed
    // instead of the app quietly serving old cached files.
    function updateVersionTag() {
      const el = document.getElementById('versionTag');
      KidsApp.getServiceWorkerVersion().then((v) => {
        el.textContent = v ? 'バージョン ' + v : '';
      });
    }
    updateVersionTag();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        setTimeout(updateVersionTag, 300);
      });
    }
  </script>
</body>
</html>
